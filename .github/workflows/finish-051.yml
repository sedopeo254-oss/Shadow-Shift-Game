name: Finalize verified Shadow Shift 0.5.1
on:
  push:
    branches: [main]
    paths:
      - updates/0.5.1.patch.gz
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shadow-shift-source-update
  cancel-in-progress: false
jobs:
  apply-tested-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the exact reviewed baseline and patch
        run: |
          test "$(git rev-parse HEAD^)" = "9648732f651425a5bb6f5d950333db9513ea8448"
          echo "7b89d40bf3b5efa99dfadd7e971fb1a62e0770161a1973423bad3b8335259d18  updates/0.5.1.patch.gz" | sha256sum -c -
          gzip -dc updates/0.5.1.patch.gz > /tmp/ss-051.patch
          git apply --unidiff-zero --check /tmp/ss-051.patch
          git apply --unidiff-zero /tmp/ss-051.patch
      - run: npm run check
      - run: npm run build
      - name: Commit tested source and remove one-time installer
        run: |
          rm updates/0.5.1.patch.gz .github/workflows/finish-051.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Shadow Shift 0.5.1 input, movement rendering, traps and editor"
          git push origin HEAD:main
          git archive --format=zip --prefix=Shadow-Shift-Game/ HEAD -o Shadow-Shift-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-Shift-Web-0.5.1
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-Shift-Source-0.5.1
          path: Shadow-Shift-Source.zip
          retention-days: 30
