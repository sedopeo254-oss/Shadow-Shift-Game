name: Validate Shadow Shift
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-Shift-Web
          path: dist/
          retention-days: 30
      - name: Archive tracked source without local data or credentials
        run: git archive --format=zip --prefix=Shadow-Shift-Game/ HEAD -o Shadow-Shift-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shadow-Shift-Source
          path: Shadow-Shift-Source.zip
          retention-days: 30
