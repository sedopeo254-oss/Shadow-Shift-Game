<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1c"><meta name="description" content="Shadow Shift — بين الضوء والظل، طريق ينتظرك.">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./src/style.css"><link rel="stylesheet" href="./src/quiet.css">
<title>Shadow Shift</title>
</head>
<body>
<canvas id="world" aria-label="عالم Shadow Shift"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main id="ui"></main>
<section id="hud" hidden aria-label="معلومات المحاولة">
 <div class="hud-top"><button class="icon-button" id="pause" aria-label="إيقاف مؤقت">Ⅱ</button><div class="stage-info"><b id="stage-label"></b><span id="stage-name"></span></div><div class="run-progress"><div><i id="progress-bar"></i></div><span id="progress-text">0%</span></div><div class="shard-count" id="shard-count">◇ ◇ ◇</div></div>
 <div id="context-hint" hidden aria-live="polite"></div>
 <div class="touch-controls" id="controls"><div class="sun-control"><label for="sun">حَرِّك الضوء <span>1 / 2 / 3</span></label><div class="sun-track"><input id="sun" type="range" min="-1" max="1" step="1" value="0" aria-label="اتجاه الشمس"><div class="sun-labels"><span>◀</span><span>◆</span><span>▶</span></div></div></div><button id="jump" class="jump-button" aria-label="قفز"><span>↑</span><b>اقفز</b><small>SPACE</small></button></div>
 <span class="attempt-label" id="attempt-label"></span>
</section>
<div id="toast" role="status"></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript>تحتاج اللعبة إلى JavaScript. جميع ملفاتها محلية ولا تحتاج إلى حساب.</noscript>
<script type="module" src="./src/app.js"></script>
</body></html>
